name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the commit-trailer check can walk base..head.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Quality gates
        run: bun run check

      # Every commit of a PR must name its OpenSpec change. Only a PR has a
      # range to check; on main the merged commits already passed it.
      - name: Commit ↔ change trailers
        if: github.event_name == 'pull_request'
        run: bun run commits:check origin/${{ github.base_ref }}..HEAD

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: E2E tests
        run: |
          if [ -f playwright.config.ts ]; then
            bunx playwright install --with-deps chromium
            bun run test:e2e
          else
            echo "no e2e suite yet (arrives with task 6.3)"
          fi
